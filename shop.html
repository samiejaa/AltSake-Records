<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Michroma&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Shop — AltSake Records</title>
<meta name="description" content="Vinyl, CDs and merch from AltSake Records artists.">
</head>
<body data-page="shop">
<header id="site-header"></header>

<main>
  <section class="hero page-hero">
    <div class="container">
      <p class="kicker">// Support the artists</p>
      <h1 class="hero-title display"><span class="chrome">The</span><span class="outline">shop</span></h1>
      <p class="lead">Physical music and merch from the AltSake family. Every purchase goes straight back into the artists.</p>
    </div>
  </section>

  <section class="section container" style="padding-top:clamp(20px,4vw,50px)">
    <div class="filters" id="shop-filters" role="toolbar" aria-label="Filter by artist"></div>
    <div class="shop-grid" id="shop-grid"></div>

    <div class="notice">
      <span class="acid mono">i</span>
      <div><b>Secure checkout through our store partner.</b> Clicking an item opens our store, where payment and shipping are handled safely. <a class="link-arrow" id="store-link" href="#" target="_blank" rel="noopener">Open the full store ↗</a></div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
